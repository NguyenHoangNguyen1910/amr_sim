services:
  amr:
    image: amr-app:latest
    container_name: amr-app
    build: .
    init: true
    environment:
      GZ_IP: 127.0.0.1
      GZ_PARTITION: amr_sim
      GZ_SIM_RESOURCE_PATH: /app/src/sim/models
      LIBGL_ALWAYS_SOFTWARE: "1"
      AMR_SLAM_KEY: ${AMR_SLAM_KEY:-amr-compose-local}
    ports:
      - "8010:8009"
      - "9002:9002"
    command: >-
      bash -lc '/usr/libexec/gz/sim10/gz-sim-server -v 4 -r --headless-rendering
      src/sim/worlds/main.sdf &
      exec uv run python -m server --host 0.0.0.0 --port 8009'
  slam:
    profiles: ["slam"]
    build: ./src/slam
    depends_on: [amr]
    environment:
      AMR_SLAM_API: http://amr:8009/api/slam
      AMR_SLAM_KEY: ${AMR_SLAM_KEY:-amr-compose-local}
      ROS_LOCALHOST_ONLY: "1"
  reeman-noetic:
    profiles: ["reeman"]
    image: ubuntu:20.04
    platform: linux/amd64
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      REEMAN_WORLD: ${REEMAN_WORLD:-room}
    healthcheck:
      test: ["CMD", "/usr/bin/test", "-f", "/run/reeman-noetic-ready"]
      interval: 2s
      timeout: 3s
      retries: 40
    volumes:
      - type: bind
        source: ./src/reeman/docker/noetic.sh
        target: /entrypoint.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./src/reeman/gazebo_depth.cpp
        target: /gazebo_depth.cpp
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/usr
        target: /usr
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/etc/ld.so.cache
        target: /etc/ld.so.cache
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/etc/alternatives
        target: /etc/alternatives
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_RUNTIME_DIR:-${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}}/opt/ros/noetic
        target: /opt/ros/noetic
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_RUNTIME_DIR:-${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}}/home/reeman/reeman_ws/install
        target: /home/reeman/reeman_ws/install
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_RUNTIME_DIR:-${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}}/home/reeman/catkin_ws/install_isolated
        target: /home/reeman/catkin_ws/install_isolated
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/home/reeman/data
        target: /backup-data
        read_only: true
        bind: {create_host_path: false}
      - reeman-run:/reeman-run
      - reeman-data:/reeman-data
  reeman-gazebo:
    profiles: ["reeman"]
    image: amr-app:latest
    build: .
    init: true
    depends_on:
      reeman-noetic:
        condition: service_healthy
        restart: true
    entrypoint: ["/bin/bash", "src/reeman/docker/gazebo.sh"]
    environment:
      REEMAN_BACKUP: /backup
      REEMAN_WORLD: ${REEMAN_WORLD:-room}
      XDG_DATA_HOME: /reeman-data
      LIBGL_ALWAYS_SOFTWARE: "1"
    ports:
      - "127.0.0.1:8020:8020"
      - "127.0.0.1:9012:9012"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8020/api/version"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/opt/ros/noetic
        target: /backup/opt/ros/noetic
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/home/reeman/data/maps
        target: /backup/home/reeman/data/maps
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/home/reeman/reeman_ws/install/share
        target: /backup/home/reeman/reeman_ws/install/share
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REEMAN_BACKUP_DIR:-/mnt/d/Embedded_Backup/ubuntu_root_full}/home/reeman/catkin_ws/install_isolated/share
        target: /backup/home/reeman/catkin_ws/install_isolated/share
        read_only: true
        bind: {create_host_path: false}
      - reeman-run:/reeman-run
      - reeman-data:/reeman-data
volumes:
  reeman-run:
  reeman-data:
